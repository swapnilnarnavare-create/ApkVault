[package]
name = "discuss-tm"
version = "3.0.0"
description = "Discuss.TM — minimalist whiteboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
