<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Discuss.TM</title>
<style>
:root{--bg:#fafafa;--panel:#fff;--ink:#111;--inv:#fff;--muted:#8a8a8a;--line:rgba(0,0,0,.09);--soft:rgba(0,0,0,.05);--shadow:0 4px 20px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
body.dark{--bg:#121212;--panel:#1e1e1e;--ink:#f1f1f1;--inv:#121212;--muted:#8d8d8d;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.07);--shadow:0 4px 20px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- home ---------- */
#home{position:fixed;inset:0;display:flex;flex-direction:column}
body.inboard #home{display:none}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(22px + env(safe-area-inset-top)) 20px 6px}
.brand{font-size:30px;font-weight:750;letter-spacing:-.03em;line-height:1}
.brand span{color:var(--muted);font-weight:600}
.sub{font-size:13px;color:var(--muted);padding:6px 20px 0}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:16px 16px calc(100px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start}
.card{position:relative;background:var(--panel);border-radius:16px;border:1px solid var(--line);overflow:hidden;text-align:left;display:block;width:100%}
.card:active{transform:scale(.98)}
.thumb{aspect-ratio:16/11;background:var(--soft);display:block;width:100%;object-fit:cover;border-bottom:1px solid var(--line)}
.meta{padding:10px 40px 12px 12px}
.name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:12px;color:var(--muted);margin-top:2px}
.more{position:absolute;right:4px;bottom:6px;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 20px;font-size:15px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:17px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));background:var(--ink);color:var(--inv);padding:15px 26px;border-radius:30px;font-weight:650;font-size:15px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}

/* ---------- board ---------- */
#board{display:none}
body.inboard #board{display:block}
canvas{position:fixed;inset:0;touch-action:none;display:block}
.bar{position:fixed;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);z-index:10;border:1px solid var(--line)}
.topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:2px;padding:calc(4px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) 4px calc(6px + env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line);transition:transform .2s ease}
body.hidebar .topbar{transform:translateY(-100%)}
.tb-scroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 18px),transparent)}
.tb-scroll::-webkit-scrollbar{display:none}
.grp{display:flex;gap:2px;width:max-content;padding:0 8px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;align-self:center;flex:none}
.handle{position:fixed;top:env(safe-area-inset-top);left:50%;transform:translateX(-50%);width:72px;height:26px;display:none;place-items:center;z-index:10}
.handle i{width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.55}
body.hidebar .handle{display:grid}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;flex:none}
.ib.on{background:var(--ink);color:var(--inv)}
.ib:disabled{opacity:.28}
.ib .ind{position:absolute;bottom:3px;left:50%;width:12px;height:3px;margin-left:-6px;border-radius:2px}
.ib.on .ind{display:none}
.pop{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;z-index:12;display:none;width:max-content;max-width:calc(100vw - 20px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.row+.row{margin-top:12px}
.lbl{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}
.sw{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line)}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.wd{width:40px;height:34px;border-radius:10px;display:grid;place-items:center}
.wd span{background:var(--ink);border-radius:9px;display:block;width:22px}
.wd.on{background:var(--soft);outline:1.5px solid var(--ink)}
.chip{border-radius:10px;padding:7px 13px;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--inv)}
.red{color:#e5383b}
textarea#ed{position:fixed;border:0;outline:0;background:transparent;resize:none;overflow:hidden;padding:0;margin:0;z-index:5;font-family:inherit;display:none;-webkit-user-select:text;user-select:text;word-break:break-word}

/* ---------- sheets, dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));z-index:21;transform:translateY(110%);transition:transform .2s ease;max-width:520px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh-title{font-size:13px;color:var(--muted);text-align:center;padding:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:15px 4px;font-size:16px;border-bottom:1px solid var(--line);text-align:left}
.item:last-child{border-bottom:0}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:2px}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ver{text-align:center;font-size:12px;color:var(--muted);padding-top:10px}
.dlg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:20px;z-index:45;width:min(330px,90vw);display:none}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.4}
.dlg input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:0;margin-bottom:14px;-webkit-user-select:text;user-select:text}
.dlg .row button{flex:1;padding:12px;border-radius:12px;font-weight:650;font-size:15px;background:var(--soft)}
.dlg .row button.pri{background:var(--ink);color:var(--inv)}
.dlg .row button.pri.danger{background:#e5383b;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.modal img{max-width:100%;max-height:70vh;border-radius:12px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.modal p{color:#fff;margin:0;font-size:14px}
.modal button{background:#fff;color:#111;padding:11px 24px;border-radius:12px;font-weight:650}
.toast{position:fixed;top:calc(66px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--inv);padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:.22s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<section id="home">
  <div class="hhead">
    <div class="brand">Discuss<span>.TM</span></div>
    <button class="round" id="h-theme" aria-label="Toggle theme"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
  <div class="sub" id="h-count"></div>
  <div id="grid"></div>
  <button class="fab" id="h-new"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg>New board</button>
</section>

<!-- ===== BOARD ===== -->
<section id="board">
  <canvas id="c"></canvas>
  <textarea id="ed" spellcheck="false"></textarea>
  <div class="topbar" id="topbar">
    <button class="ib" id="back" aria-label="All boards"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tb-scroll" id="tbs">
     <div class="grp" id="g-tools">
      <button class="ib" data-tool="select" aria-label="Select"><svg class="i" viewBox="0 0 24 24"><path d="M6 3l13 8.5-6 1.2L9.8 19z"/></svg></button>
      <button class="ib" data-tool="pen" aria-label="Pen"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1.2-4.2L16 5l3 3L8.2 18.8z"/><path d="M14 7l3 3"/></svg><i class="ind"></i></button>
      <button class="ib" data-tool="hl" aria-label="Highlighter"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-7.5 7.5H7v-5z"/><path d="M7 17l-3 3h6"/></svg><i class="ind"></i></button>
      <button class="ib" data-tool="eraser" aria-label="Eraser"><svg class="i" viewBox="0 0 24 24"><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/><path d="M9 19h11"/></svg></button>
      <button class="ib" data-tool="shape" aria-label="Shapes"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="10.5" width="9" height="9" rx="1.5"/><circle cx="16" cy="8" r="4.5"/></svg><i class="ind"></i></button>
      <button class="ib" data-tool="note" aria-label="Sticky note"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/></svg><i class="ind"></i></button>
      <button class="ib" data-tool="text" aria-label="Text"><svg class="i" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></button>
      <span class="sep"></span>
      <button class="ib" id="hide" aria-label="Hide toolbar"><svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
     </div>
     <div class="grp" id="g-sel" style="display:none">
      <button class="ib" id="s-done" aria-label="Done"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <span class="sep"></span>
      <button class="ib" id="s-edit" aria-label="Edit text"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
      <button class="ib" id="s-style" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle id="s-dot" cx="12" cy="12" r="3.5" style="fill:currentColor;stroke:none"/></svg></button>
      <button class="ib" id="s-dup" aria-label="Duplicate"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button class="ib" id="s-front" aria-label="Bring to front"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5" opacity=".45"/></svg></button>
      <button class="ib red" id="s-del" aria-label="Delete"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
     </div>
    </div>
    <button class="ib" id="undo" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="redo" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="ib" id="menu" aria-label="Board menu"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </div>
  <button class="handle" id="handle" aria-label="Show toolbar"><i></i></button>
  <div class="pop" id="pop"></div>
</section>

<!-- ===== shared overlays ===== -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="dlg" id="dlg"><h3 id="dlg-t"></h3><p id="dlg-m"></p><input id="dlg-in" maxlength="60"><div class="row"><button id="dlg-no">Cancel</button><button class="pri" id="dlg-ok">OK</button></div></div>
<div class="modal" id="modal"><img id="expimg" alt="Exported board"><p>Long-press the image to save or share</p><button id="modal-x">Done</button></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP='Discuss.TM',VERSION='2.2';
const $=s=>document.querySelector(s);
const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
const cv=$('#c'),ctx=cv.getContext('2d',{alpha:false});
const mctx=document.createElement('canvas').getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ser=o=>JSON.stringify(o,(k,v)=>k&&k[0]==='_'?undefined:v);

/* ================= storage ================= */
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));return true}catch(e){toast('Storage full — delete an old board');return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const IDX='dtm_idx',SET='dtm_set',BK=id=>'dtm_b_'+id;
let boards=store.get(IDX)||[];
const prefs=Object.assign({dark:false},store.get(SET)||{});
const S={pen:{c:'ink',w:4},hl:{c:'#ffe000',w:22},shape:{k:'rect',c:'ink',w:3,fill:false},note:{c:'#fff3a3'},text:{c:'ink',z:28}};
if(prefs.S)for(const k in S)Object.assign(S[k],prefs.S[k]||{});
function savePrefs(){prefs.S=S;store.set(SET,prefs)}
function saveIdx(){store.set(IDX,boards)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function normalize(o){if(o.pts){o.p=o.pts.flat();delete o.pts}delete o.editing;return o}
/* migrate the single board from Whiteboard v1.0 */
(function migrate(){if(boards.length)return;const old=store.get('wb_board_v1');if(!old||!old.objs||!old.objs.length)return;
  const id=uid();boards.push({id,name:'My first board',updated:Date.now(),thumb:''});
  store.set(BK(id),{objs:old.objs.map(normalize),cam:old.cam,bg:old.bgMode||'dots',nextId:old.nextId||999});
  if(old.dark)prefs.dark=true;saveIdx();store.del('wb_board_v1')})();

/* ================= board state ================= */
let W=0,H=0,dpr=1;
let cur=null,objs=[],nextId=1,cam={x:0,y:0,s:1},bgMode='dots';
let undoS=[],redoS=[];
let tool='pen',selId=null,act=null,erPos=null,editing=null,editNew=false,editBefore='',popKind=null;
const INK=['ink','#e5383b','#1e6fd9','#2a9d50','#f08c00','#8e44ad','#8a8a8a'];
const HLC=['#ffe000','#7cf07c','#ff7ad9','#6ad3ff','#ffad42'];
const NOTEC=['#fff3a3','#ffc9de','#c8f2c2','#c6e4ff','#e3d3ff','#ffd8b0'];
const SIZES=[[18,'S'],[28,'M'],[44,'L'],[72,'XL']];
const col=c=>c==='ink'?(prefs.dark?'#f1f1f1':'#111111'):c;
const bgColor=()=>prefs.dark?'#121212':'#fafafa';
const toWorld=(sx,sy)=>({x:(sx-cam.x)/cam.s,y:(sy-cam.y)/cam.s});
const idxOf=id=>objs.findIndex(o=>o.id===id);
const getObj=id=>objs.find(o=>o.id===id);

/* ---------- save (debounced, only the open board) ---------- */
let saveT=0;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(flush,500)}
function flush(){clearTimeout(saveT);if(!cur)return;store.set(BK(cur.id),ser({objs,cam,bg:bgMode,nextId}));cur.updated=Date.now();saveIdx()}

/* ---------- history: small diff ops, not snapshots ---------- */
function pushOp(op){undoS.push(op);if(undoS.length>100)undoS.shift();redoS=[];updUndo();saveSoon()}
function applyOp(op,back){
  switch(op.k){
    case 'add':if(back){const i=idxOf(op.id);if(i>=0)objs.splice(i,1)}else objs.splice(Math.min(op.i,objs.length),0,JSON.parse(op.o));break;
    case 'del':if(back){for(let j=op.items.length-1;j>=0;j--){const it=op.items[j];objs.splice(Math.min(it[0],objs.length),0,JSON.parse(it[2]))}}
               else for(const it of op.items){const i=idxOf(it[1]);if(i>=0)objs.splice(i,1)}break;
    case 'mod':{const i=idxOf(op.id);if(i>=0)objs[i]=JSON.parse(back?op.b:op.a);break}
    case 'ord':{const i=idxOf(op.id);if(i<0)break;const [o]=objs.splice(i,1);objs.splice(back?op.from:op.to,0,o);break}
  }
}
function undo(){commitEdit();const op=undoS.pop();if(!op)return;applyOp(op,true);redoS.push(op);afterHist()}
function redo(){commitEdit();const op=redoS.pop();if(!op)return;applyOp(op,false);undoS.push(op);afterHist()}
function afterHist(){if(selId&&!getObj(selId))selId=null;updUndo();updSel();saveSoon();dirty()}
function updUndo(){$('#undo').disabled=!undoS.length;$('#redo').disabled=!redoS.length}

/* ================= geometry ================= */
function dSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;return Math.hypot(ax+t*dx-px,ay+t*dy-py)}
function calcB(o){
  if(o.t==='stroke'){const p=o.p;let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let i=0;i<p.length;i+=2){const x=p[i],y=p[i+1];if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y}const h=o.w/2;return{x:a-h,y:b-h,w:c-a+o.w,h:d-b+o.w}}
  if('x1' in o){const h=o.w/2+(o.t==='arrow'?o.w*2:0);return{x:Math.min(o.x1,o.x2)-h,y:Math.min(o.y1,o.y2)-h,w:Math.abs(o.x2-o.x1)+2*h,h:Math.abs(o.y2-o.y1)+2*h}}
  if(o.t==='note')return{x:o.x,y:o.y,w:o.w,h:o.h};
  mctx.font=`500 ${o.z}px ${FONT}`;const L=(o.text||'').split('\n');let w=0;for(const l of L)w=Math.max(w,mctx.measureText(l).width);return{x:o.x,y:o.y,w:Math.max(w,o.z*.6),h:L.length*o.z*1.25}
}
const bounds=o=>o._b||(o._b=calcB(o));
function allBounds(){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const o of objs){const r=bounds(o);a=Math.min(a,r.x);b=Math.min(b,r.y);c=Math.max(c,r.x+r.w);d=Math.max(d,r.y+r.h)}return{x:a,y:b,w:c-a,h:d-b}}
const inBox=(r,x,y,pad)=>x>=r.x-pad&&x<=r.x+r.w+pad&&y>=r.y-pad&&y<=r.y+r.h+pad;
function hit(o,x,y,r,edge){
  if(!inBox(bounds(o),x,y,r))return false;
  const tol=(o.w||0)/2+r;
  switch(o.t){

  else if(kind==='sel'){const o=getObj(selId);if(!o){closePop();return}
    const change=fn=>{const b=ser(o);fn();o._b=null;pushOp({k:'mod',id:o.id,b,a:ser(o)});dirty();updSel()};
    swatches(o.t==='note'?NOTEC:o.hl?HLC:INK,o.c,c=>change(()=>o.c=c));
    if(o.t==='text')chips(SIZES,o.z,z=>change(()=>o.z=z));
    if(o.t!=='note'&&o.t!=='text')widths(o.t==='stroke'?(o.hl?[14,22,32]:[2,4,8,14]):[2,3,6,10],o.w,w=>change(()=>o.w=w));
    if(['rect','ellipse','tri'].includes(o.t))chips([[0,'Outline'],[1,'Filled']],o.fill?1:0,v=>change(()=>{if(v)o.fill=1;else delete o.fill}))}
  p.style.display='block';
}
function closePop(){$('#pop').style.display='none';popKind=null}

/* ---------- selection bar ---------- */
function showGroup(sel){const g=$('#g-sel'),t=$('#g-tools'),want=sel?'flex':'none';if(g.style.display!==want){g.style.display=want;t.style.display=sel?'none':'flex';$('#tbs').scrollLeft=0}}
function hideSelbar(){showGroup(false);if(popKind==='sel')closePop()}
function updSel(){const o=selId&&getObj(selId);if(!o||editing||(act&&act.k==='move'&&act.moved)){hideSelbar();return}
  showGroup(true);$('#s-edit').style.display=(o.t==='note'||o.t==='text')?'grid':'none';$('#s-dot').style.fill=col(o.c)}
$('#s-done').onclick=()=>{selId=null;closePop();updSel();dirty()};
function setBar(show){document.body.classList.toggle('hidebar',!show);if(!show)closePop()}
$('#hide').onclick=()=>setBar(false);$('#handle').onclick=()=>setBar(true);
$('#s-edit').onclick=()=>{const o=getObj(selId);if(o)startEdit(o,false)};
$('#s-style').onclick=()=>popKind==='sel'?closePop():openPop('sel');
$('#s-dup').onclick=()=>{const o=getObj(selId);if(!o)return;const c=JSON.parse(ser(o));c.id=nextId++;moveObj(c,24,24);objs.push(c);pushOp({k:'add',id:c.id,i:objs.length-1,o:ser(c)});selId=c.id;updSel();dirty()};
$('#s-front').onclick=()=>{const i=idxOf(selId);if(i<0||i===objs.length-1)return;const [o]=objs.splice(i,1);objs.push(o);pushOp({k:'ord',id:o.id,from:i,to:objs.length-1});dirty()};
$('#s-del').onclick=()=>{const i=idxOf(selId);if(i<0)return;const o=objs[i];objs.splice(i,1);pushOp({k:'del',items:[[i,o.id,ser(o)]]});selId=null;closePop();updSel();dirty()};

/* ================= sheets & dialogs ================= */
function openSheet(title,build){commitEdit();closePop();const b=$('#sheet-body');b.innerHTML='';if(title)b.appendChild(el('div','sh-title',title));build(b);
  $('#scrim').style.display='block';requestAnimationFrame(()=>$('#sheet').classList.add('open'))}
function closeSheet(){$('#sheet').classList.remove('open');setTimeout(()=>{if(!$('#sheet').classList.contains('open')&&$('#dlg').style.display!=='block')$('#scrim').style.display='none'},200)}
$('#scrim').onclick=()=>{if($('#dlg').style.display==='block')$('#dlg-no').click();else closeSheet()};
function item(parent,label,right,fn,cls){const b=el('button','item'+(cls?' '+cls:''));b.innerHTML=`<span>${label}</span>`;if(right)b.appendChild(typeof right==='string'?el('span',null,right):right);if(fn)b.onclick=fn;parent.appendChild(b);return b}
function seg(opts,curV,on){const s=el('div','seg');for(const [v,n] of opts){const b=el('button',v===curV?'on':'',n);b.onclick=e=>{e.stopPropagation();on(v);s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};s.appendChild(b)}return s}
function dialog({title,msg='',input=null,ok='OK',danger=false}){return new Promise(res=>{
  $('#dlg-t').textContent=title;$('#dlg-m').textContent=msg;$('#dlg-m').style.display=msg?'block':'none';
  const inp=$('#dlg-in');inp.style.display=input!=null?'block':'none';inp.value=input||'';
  const okB=$('#dlg-ok');okB.textContent=ok;okB.classList.toggle('danger',danger);
  $('#scrim').style.display='block';$('#dlg').style.display='block';if(input!=null){inp.focus();inp.select()}
  const done=v=>{$('#dlg').style.display='none';$('#scrim').style.display='none';okB.onclick=$('#dlg-no').onclick=inp.onkeydown=null;res(v)};
  okB.onclick=()=>done(input!=null?inp.value.trim():true);$('#dlg-no').onclick=()=>done(null);
  inp.onkeydown=e=>{if(e.key==='Enter')okB.click()}})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2000)}

/* ================= board menu ================= */
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#back').onclick=()=>closeBoard();
async function renameCur(){commitEdit();const n=await dialog({title:'Rename board',input:cur.name,ok:'Save'});if(n){cur.name=n;saveIdx()}}
const fsOK=!window.Android&&!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function toggleFS(){const d=document,on=d.fullscreenElement||d.webkitFullscreenElement;
  try{const r=on?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen).call(d.documentElement);if(r&&r.catch)r.catch(()=>toast('Full screen not available here'))}catch(e){toast('Full screen not available here')}}
$('#menu').onclick=()=>openSheet(cur.name,b=>{
  item(b,'Rename board','',()=>{closeSheet();renameCur()});
  item(b,'Hide toolbar','',()=>{closeSheet();setBar(false)});
  if(fsOK)item(b,(document.fullscreenElement||document.webkitFullscreenElement)?'Exit full screen':'Full screen','',()=>{closeSheet();toggleFS()});
  item(b,'Zoom to fit','',()=>{closeSheet();fit()});
  item(b,'Reset zoom',Math.round(cam.s*100)+'%',()=>{closeSheet();zoomAt(W/2,H/2,1/cam.s)});
  item(b,'Background',seg([['dots','Dots'],['grid','Grid'],['plain','Plain']],bgMode,v=>{bgMode=v;saveSoon();dirty()}));
  item(b,'Theme',seg([[false,'Light'],[true,'Dark']],prefs.dark,v=>{setDark(v);dirty()}));
  item(b,'Export as image','',()=>{closeSheet();exportPNG()});
  item(b,'Clear board','',async()=>{closeSheet();if(!objs.length){toast('Board is already empty');return}
    if(await dialog({title:'Clear this board?',msg:'Everything on it will be removed. You can undo this.',ok:'Clear',danger:true})){
      const items=[];for(let i=objs.length-1;i>=0;i--)items.push([i,objs[i].id,ser(objs[i])]);objs=[];selId=null;pushOp({k:'del',items});updSel();dirty()}},'red');
  b.appendChild(el('div','ver',`${APP} v${VERSION}`));
});
function fit(){if(!objs.length){cam={x:W/2,y:H/2,s:1};dirty();return}const b=allBounds(),s=clamp(Math.min((W-60)/b.w,(H-200)/b.h),.1,2);cam.s=s;cam.x=W/2-(b.x+b.w/2)*s;cam.y=H/2-(b.y+b.h/2)*s;dirty();saveSoon()}
function renderTo(w,h,pad,maxScale){const b=allBounds(),sc=Math.min(maxScale,(w-pad*2)/b.w,(h-pad*2)/b.h);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=bgColor();g.fillRect(0,0,w,h);g.setTransform(sc,0,0,sc,w/2-(b.x+b.w/2)*sc,h/2-(b.y+b.h/2)*sc);for(const o of objs)drawObj(g,o);return c}
function exportPNG(){commitEdit();if(!objs.length){toast('Nothing to export yet');return}
  const b=allBounds(),sc=Math.min(2,5000/(b.w+80),5000/(b.h+80));const c=renderTo(Math.ceil((b.w+80)*sc),Math.ceil((b.h+80)*sc),40*sc,sc);
  const url=c.toDataURL('image/png');c.width=c.height=0;
  if(window.Android&&Android.saveImage){const n=(cur.name+'-'+new Date().toISOString().slice(0,16)).replace(/[^\w.-]+/g,'_')+'.png';const r=Android.saveImage(url,n);toast(r==='ERR'?'Could not save image':r);return}
  $('#expimg').src=url;$('#modal').style.display='flex'}
$('#modal-x').onclick=()=>{$('#modal').style.display='none';$('#expimg').removeAttribute('src')};
function makeThumb(){if(!objs.length)return'';const c=renderTo(320,220,14,1.5);const d=c.toDataURL('image/jpeg',.7);c.width=c.height=0;return d}

/* ================= boards ================= */
function setDark(v){prefs.dark=v;savePrefs();document.body.classList.toggle('dark',v);document.querySelector('meta[name=theme-color]').content=bgColor();updTools()}
function openBoard(meta){
  cur=meta;const d=store.get(BK(meta.id))||{};
  objs=(d.objs||[]).map(normalize);nextId=d.nextId||objs.reduce((m,o)=>Math.max(m,o.id||0),0)+1;bgMode=d.bg||'dots';
  undoS=[];redoS=[];selId=null;act=null;
  document.body.classList.add('inboard');setBar(true);
  resize();cam=d.cam||{x:W/2,y:H/2,s:1};
  setTool(tool);updUndo();updSel();dirty();
}
function closeBoard(){commitEdit();closePop();if(!cur)return;flush();cur.thumb=makeThumb();saveIdx();
  cur=null;objs=[];undoS=[];redoS=[];if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});dropBase();cv.width=cv.height=1; /* release board memory */
  document.body.classList.remove('inboard');renderHome()}
function newBoard(name,data){const meta={id:uid(),name,updated:Date.now(),thumb:''};boards.unshift(meta);store.set(BK(meta.id),data||{objs:[],bg:'dots',nextId:1});saveIdx();return meta}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';if(s<604800)return Math.floor(s/86400)+' d ago';return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function renderHome(){
  boards.sort((a,b)=>b.updated-a.updated);
  const g=$('#grid');g.innerHTML='';
  $('#h-count').textContent=boards.length?boards.length+(boards.length===1?' board':' boards'):'';
  if(!boards.length){g.appendChild(el('div','empty','<b>No boards yet</b>Tap New board to start a discussion.'));return}
  for(const m of boards){
    const c=el('div','card');c.setAttribute('role','button');
    const t=m.thumb?el('img','thumb'):el('div','thumb');if(m.thumb){t.src=m.thumb;t.alt=''}
    c.appendChild(t);
    const meta=el('div','meta');meta.appendChild(el('div','name')).textContent=m.name;meta.appendChild(el('div','date',ago(m.updated)));c.appendChild(meta);
    const mo=el('button','more','<svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>');mo.setAttribute('aria-label','Board options');
    mo.onclick=e=>{e.stopPropagation();boardActions(m)};c.appendChild(mo);
    c.onclick=()=>openBoard(m);
    g.appendChild(c);
  }
}
function boardActions(m){openSheet(m.name,b=>{
  item(b,'Open','',()=>{closeSheet();openBoard(m)});
  item(b,'Rename','',async()=>{closeSheet();const n=await dialog({title:'Rename board',input:m.name,ok:'Save'});if(n){m.name=n;saveIdx();renderHome()}});
  item(b,'Duplicate','',()=>{closeSheet();const d=store.get(BK(m.id));const n=newBoard(m.name+' copy',d||undefined);n.thumb=m.thumb;n.updated=Date.now();saveIdx();renderHome();toast('Board duplicated')});
  item(b,'Delete','',async()=>{closeSheet();if(await dialog({title:`Delete “${m.name}”?`,msg:'This board will be permanently removed from this device.',ok:'Delete',danger:true})){
    store.del(BK(m.id));boards=boards.filter(x=>x!==m);saveIdx();renderHome();toast('Board deleted')}},'red');
})}
$('#h-new').onclick=async()=>{const n=await dialog({title:'New board',input:'Board '+(boards.length+1),ok:'Create'});if(n==null)return;openBoard(newBoard(n||'Untitled'))};
$('#h-theme').onclick=()=>setDark(!prefs.dark);

/* ================= keyboard (tablet / desktop) ================= */
addEventListener('keydown',e=>{if(!cur||e.target.tagName==='INPUT')return;if(editing){if(e.key==='Escape')commitEdit();return}
  const m=e.ctrlKey||e.metaKey;
  if(m&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(m&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if((e.key==='Delete'||e.key==='Backspace')&&selId)$('#s-del').click();
  else if(e.key===' ')spaceDown=true;
  else if(!m){const k={v:'select',p:'pen',h:'hl',e:'eraser',s:'shape',n:'note',t:'text'}[e.key.toLowerCase()];if(k)setTool(k)}});
addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false});

/* ================= Android shell hooks ================= */
window.__back=()=>{
  if($('#modal').style.display==='flex'){$('#modal-x').click();return true}
  if($('#dlg').style.display==='block'){$('#dlg-no').click();return true}
  if($('#sheet').classList.contains('open')){closeSheet();return true}
  if(popKind){closePop();return true}
  if(editing){commitEdit();return true}
  if(cur){if(selId){selId=null;updSel();dirty();return true}closeBoard();return true}
  return false};
window.__flush=()=>{if(cur){commitEdit();flush();cur.thumb=makeThumb();saveIdx()}};

/* ================= boot ================= */
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cur){flush();cur.thumb=makeThumb();saveIdx()}});
setDark(prefs.dark);
if(!boards.length&&!store.get('dtm_welcomed')){
  const m=newBoard('Welcome',{objs:[{id:1,t:'note',c:'#fff3a3',x:-120,y:-140,w:240,h:250,text:'Welcome to Discuss.TM\n\nDraw with one finger. Pinch with two to zoom and pan.\n\nDouble-tap a note to edit it.'}],bg:'dots',nextId:2});
  store.set('dtm_welcomed',1);
}
renderHome();
</script>
</body>
</html>
